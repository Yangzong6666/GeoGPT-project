<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGPT 智能助手</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>GeoGPT 智能助手</h1>
                </div>
                <div class="status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">准备就绪</span>
                </div>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-text">
                            您好！我是GeoGPT智能助手，很高兴为您服务。请问有什么可以帮助您的吗？
                        </div>
                        <div class="message-time">
                            <span id="initialTime"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="请输入您的问题..." 
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button id="sendButton" class="send-button">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-footer">
                <span class="char-count">
                    <span id="charCount">0</span>/2000
                </span>
                <div class="controls">
                    <button id="clearButton" class="control-button" title="清空对话">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button id="settingsButton" class="control-button" title="设置">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置</h3>
                <button class="close-button" id="closeSettings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="temperatureSlider">回答创造性 (Temperature)</label>
                    <div class="slider-container">
                        <input type="range" id="temperatureSlider" min="0" max="1" step="0.1" value="0.7">
                        <span id="temperatureValue">0.7</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label for="maxTokensInput">最大回复长度</label>
                    <input type="number" id="maxTokensInput" min="100" max="4000" value="1000">
                </div>
                <div class="setting-group">
                    <label for="systemPromptInput">系统提示词</label>
                    <textarea id="systemPromptInput" rows="3" placeholder="设置AI的角色和行为规则...">你是一个有用、无害、诚实的AI助手。</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="save-button">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="loading-spinner"></div>
        <span>AI正在思考中...</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
