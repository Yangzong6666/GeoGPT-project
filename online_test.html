<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 GeoGPT API 在线测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 2rem;
        }

        .section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .section h3 {
            color: #334155;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        input[type="text"], 
        input[type="url"], 
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus, 
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #94a3b8;
            flex-shrink: 0;
        }

        .status-indicator.connecting {
            background: #f59e0b;
            animation: pulse 2s infinite;
        }

        .status-indicator.success {
            background: #10b981;
        }

        .status-indicator.error {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result-section {
            margin-top: 2rem;
        }

        .result-content {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        .result-content.show {
            display: block;
        }

        .result-success {
            border-left: 4px solid #10b981;
        }

        .result-error {
            border-left: 4px solid #ef4444;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .tips {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .tips h4 {
            color: #1e40af;
            margin-bottom: 0.5rem;
        }

        .tips ul {
            margin-left: 1.5rem;
            color: #1e40af;
        }

        .tips li {
            margin-bottom: 0.3rem;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                flex: none;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 GeoGPT API 在线测试工具</h1>
            <p>快速验证您的API配置并测试连接</p>
        </div>

        <div class="content">
            <!-- API配置部分 -->
            <div class="section">
                <h3>🔧 API 配置</h3>
                <div class="form-group">
                    <label for="baseUrl">API 基础地址:</label>
                    <input type="url" id="baseUrl" value="https://geogpt.zero2x.org.cn/api/v1" 
                           placeholder="https://geogpt.zero2x.org.cn/api/v1">
                </div>
                <div class="form-group">
                    <label for="apiKey">API 密钥:</label>
                    <input type="text" id="apiKey" value="sk-z75090H521z8f37O3973" 
                           placeholder="sk-z75090H521z8f37O3973">
                </div>
                <div class="form-group">
                    <label for="apiName">API 名称:</label>
                    <input type="text" id="apiName" value="CUG_key_first" 
                           placeholder="CUG_key_first">
                </div>
                <div class="form-group">
                    <label for="model">模型名称:</label>
                    <input type="text" id="model" value="geogpt-base" 
                           placeholder="geogpt-base">
                </div>
            </div>

            <!-- 测试消息部分 -->
            <div class="section">
                <h3>💬 测试消息</h3>
                <div class="form-group">
                    <label for="testMessage">测试消息内容:</label>
                    <textarea id="testMessage" placeholder="输入要发送给GeoGPT的测试消息...">你好，请简短介绍一下自己</textarea>
                </div>
            </div>

            <!-- 状态指示 -->
            <div class="status-section">
                <div class="status-indicator" id="statusIndicator"></div>
                <div>
                    <strong id="statusText">等待测试...</strong>
                    <div class="progress-bar" id="progressBar" style="display: none;">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="button-group">
                <button class="btn-primary" id="testBtn" onclick="startTest()">
                    🔗 开始测试连接
                </button>
                <button class="btn-secondary" onclick="clearResults()">
                    🗑️ 清空结果
                </button>
                <button class="btn-secondary" onclick="exportConfig()">
                    📋 导出配置
                </button>
            </div>

            <!-- 结果显示 -->
            <div class="result-section">
                <h3>📊 测试结果</h3>
                <div class="result-content" id="resultContent"></div>
            </div>

            <!-- 使用提示 -->
            <div class="tips">
                <h4>💡 使用提示</h4>
                <ul>
                    <li>首次使用建议先用默认配置测试</li>
                    <li>如果测试失败，请检查网络连接和API配置</li>
                    <li>成功测试后，可以将配置应用到主聊天界面</li>
                    <li>点击"导出配置"可以获取JavaScript配置代码</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        let isTestingInProgress = false;

        // 更新状态指示器
        function updateStatus(text, type) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            indicator.className = `status-indicator ${type}`;
            statusText.textContent = text;
        }

        // 更新进度条
        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            if (percent > 0) {
                progressBar.style.display = 'block';
                progressFill.style.width = percent + '%';
            } else {
                progressBar.style.display = 'none';
            }
        }

        // 显示结果
        function showResult(content, type) {
            const resultContent = document.getElementById('resultContent');
            resultContent.className = `result-content show result-${type}`;
            resultContent.textContent = content;
        }

        // 清空结果
        function clearResults() {
            const resultContent = document.getElementById('resultContent');
            resultContent.className = 'result-content';
            updateStatus('等待测试...', '');
            updateProgress(0);
        }

        // 导出配置
        function exportConfig() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const apiName = document.getElementById('apiName').value.trim();
            const model = document.getElementById('model').value.trim();

            const config = `// GeoGPT API 配置
const API_CONFIG = {
    baseUrl: '${baseUrl}',
    apiKey: '${apiKey}',
    apiName: '${apiName}',
    model: '${model}',
    timeout: 30000
};`;

            navigator.clipboard.writeText(config).then(() => {
                alert('配置代码已复制到剪贴板！\n\n您可以将其粘贴到 script.js 文件中替换现有配置。');
            }).catch(() => {
                showResult(`配置代码：\n\n${config}\n\n请手动复制上述代码到 script.js 文件中。`, 'success');
            });
        }

        // 主测试函数
        async function startTest() {
            if (isTestingInProgress) return;
            
            isTestingInProgress = true;
            const testBtn = document.getElementById('testBtn');
            testBtn.disabled = true;
            testBtn.innerHTML = '🔄 测试中...';

            try {
                // 第一步：验证配置
                updateStatus('验证配置...', 'connecting');
                updateProgress(10);
                await sleep(500);

                const baseUrl = document.getElementById('baseUrl').value.trim();
                const apiKey = document.getElementById('apiKey').value.trim();
                const apiName = document.getElementById('apiName').value.trim();
                const model = document.getElementById('model').value.trim();
                const testMessage = document.getElementById('testMessage').value.trim();

                if (!baseUrl || !apiKey || !apiName || !model || !testMessage) {
                    throw new Error('请填写完整的配置信息');
                }

                // 第二步：准备请求
                updateStatus('准备API请求...', 'connecting');
                updateProgress(25);
                await sleep(500);

                const apiUrl = `${baseUrl}/chat/completions`;
                const requestData = {
                    model: model,
                    messages: [
                        {
                            role: 'user',
                            content: testMessage
                        }
                    ],
                    max_tokens: 100,
                    temperature: 0.1
                };

                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'X-API-Name': apiName
                };

                // 第三步：发送请求
                updateStatus('发送API请求...', 'connecting');
                updateProgress(50);

                console.log('发送测试请求到:', apiUrl);
                console.log('请求数据:', requestData);

                const startTime = Date.now();
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestData),
                    signal: AbortSignal.timeout(20000)
                });

                const endTime = Date.now();
                const responseTime = endTime - startTime;

                // 第四步：处理响应
                updateStatus('处理响应...', 'connecting');
                updateProgress(75);
                await sleep(300);

                const responseText = await response.text();
                
                // 第五步：分析结果
                updateStatus('分析结果...', 'connecting');
                updateProgress(90);
                await sleep(300);

                let result = {
                    timestamp: new Date().toLocaleString('zh-CN'),
                    url: apiUrl,
                    status: response.status,
                    statusText: response.statusText,
                    responseTime: responseTime,
                    headers: Object.fromEntries(response.headers.entries()),
                    success: response.ok
                };

                if (response.ok) {
                    try {
                        const jsonData = JSON.parse(responseText);
                        result.data = jsonData;
                        
                        updateStatus('测试成功！', 'success');
                        updateProgress(100);

                        let successMessage = `✅ GeoGPT API 连接测试成功！

🕒 测试时间: ${result.timestamp}
📊 响应状态: ${result.status} ${result.statusText}
⚡ 响应时间: ${responseTime}ms
🌐 请求地址: ${apiUrl}
🤖 使用模型: ${model}

📝 API 响应内容:
${JSON.stringify(jsonData, null, 2)}

✨ 配置验证通过！您可以使用此配置在主界面中与GeoGPT对话。`;

                        showResult(successMessage, 'success');

                    } catch (parseError) {
                        updateStatus('响应格式异常', 'error');
                        
                        let warningMessage = `⚠️ API连接成功，但响应格式异常

📊 响应状态: ${result.status}
⚡ 响应时间: ${responseTime}ms

🔍 原始响应内容:
${responseText}

💡 可能的原因:
- API返回了非JSON格式的响应
- 响应格式与标准不符
- 服务端配置问题

建议联系API服务提供商确认响应格式。`;

                        showResult(warningMessage, 'error');
                    }
                } else {
                    updateStatus('连接失败', 'error');
                    
                    let errorMessage = `❌ GeoGPT API 连接失败

🔍 错误详情:
状态码: ${result.status} ${result.statusText}
响应时间: ${responseTime}ms
请求地址: ${apiUrl}

📋 解决建议:`;

                    if (result.status === 401) {
                        errorMessage += `
❗ 认证失败 (401)
- 检查API密钥是否正确
- 验证API名称是否有效
- 确认账户权限设置`;
                    } else if (result.status === 404) {
                        errorMessage += `
❗ 接口不存在 (404)
- 检查API基础地址是否正确
- 确认接口路径是否存在
- 验证API版本是否匹配`;
                    } else if (result.status === 429) {
                        errorMessage += `
❗ 请求频率过高 (429)
- 稍等片刻后重试
- 检查API配额限制
- 联系服务商提升限额`;
                    } else if (result.status === 500) {
                        errorMessage += `
❗ 服务器内部错误 (500)
- API服务可能暂时不可用
- 联系服务提供商确认状态
- 稍后重试`;
                    } else {
                        errorMessage += `
❗ 其他错误 (${result.status})
- 检查网络连接状态
- 确认防火墙设置
- 联系技术支持`;
                    }

                    if (responseText) {
                        errorMessage += `\n\n🔍 服务器响应:\n${responseText}`;
                    }

                    showResult(errorMessage, 'error');
                }

            } catch (error) {
                updateStatus('测试失败', 'error');
                updateProgress(0);
                
                let errorMessage = `💥 连接测试失败

🚨 错误类型: ${error.name}
📝 错误信息: ${error.message}

🔧 可能的原因和解决方法:`;

                if (error.name === 'AbortError') {
                    errorMessage += `
❗ 请求超时
- 网络连接缓慢
- API服务响应慢
- 防火墙阻止连接
→ 检查网络后重试`;
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage += `
❗ 网络连接失败
- 无法访问API地址
- DNS解析失败
- CORS跨域限制
→ 检查网络连接和API地址`;
                } else if (error.message.includes('配置信息')) {
                    errorMessage += `
❗ 配置信息不完整
- 请确保所有字段都已填写
- 检查格式是否正确
→ 完善配置信息后重试`;
                } else {
                    errorMessage += `
❗ 未知错误
- 可能是浏览器兼容性问题
- 或其他技术问题
→ 尝试刷新页面或更换浏览器`;
                }

                errorMessage += `\n\n📞 如需帮助:
1. 检查浏览器控制台(F12)查看详细错误
2. 确认网络连接正常
3. 联系GeoGPT服务提供商
4. 参考API文档确认配置`;

                showResult(errorMessage, 'error');
                console.error('API测试失败:', error);
            } finally {
                isTestingInProgress = false;
                testBtn.disabled = false;
                testBtn.innerHTML = '🔗 开始测试连接';
                setTimeout(() => updateProgress(0), 2000);
            }
        }

        // 辅助函数：延时
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('GeoGPT API 在线测试工具已就绪');
            
            // 检查是否支持必要的API
            if (!window.fetch) {
                showResult('⚠️ 您的浏览器不支持fetch API，请更新浏览器版本', 'error');
            }
        });

        // 监听回车键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                startTest();
            }
        });
    </script>
</body>
</html>
